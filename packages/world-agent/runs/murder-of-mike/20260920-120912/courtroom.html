  const done = typed>=fullText.length;
  ov.innerHTML=`<div class="balloon k-${ch.kind}" id="bl">
    <div class="nm">${esc(ch.n)} · ${esc(ch.r)}</div>
    <div class="tx">${esc(fullText.slice(0,Math.floor(typed)))}${done?"":'<span class="caret"></span>'}</div>
    ${done&&chips?`<div class="meta">${chips}</div>`:""}
    ${mode==="manual"&&canAdvance()?`<div class="cont">${done?"continue ▸":"tap to skip ▸"}</div>`:""}</div>`;
  ov.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>openEvidence(b.dataset.ev));
  positionOverlay();
}
function positionOverlay(){
  const b=$("bl"); if(!b||!actor)return;
  const [lx,ly]=screenOf(actorPos[actor][0],actorPos[actor][1]);
  b.style.left=Math.max(22,Math.min(78,lx))+"%";
  b.style.top=Math.max(14,ly)+"%";
}
function endOfRecord(){
  ended=true;
  const text=COMPLETE?"The record ends here.":"The record ends here. The run is in progress.";
  logLine({kind:"court",text}); say("COURT",text,null);
  $("playBtn").disabled=true;$("nextBtn").disabled=true;$("tap").hidden=true;$("hint").hidden=true;
  $("playBtn").textContent=COMPLETE?"Done":"In progress";
}

/* ============ aside ============ */
function logLine(t){
  const pane=$("pane-rec"), el=document.createElement("div");
  if(t.kind==="error"||t.kind==="rejected"){
    el.className="turn sys "+t.kind;
    el.innerHTML=`<div class="ln">—</div><div><p class="said">${esc(t.text)}</p></div>`;
  }else{
    line++;
    const who=t.kind==="court"?"COURT":t.who, ch=CAST[who]||{n:who,kind:"human"};
    const chips=t.kind==="turn"?chipsOf(t):"";
    el.className="turn";
    el.innerHTML=`<div class="ln">${line}</div><div>
      <div class="who ${ch.kind}">${esc(ch.n)}</div><p class="said">${esc(t.text)}</p>${chips?`<div class="meta">${chips}</div>`:""}</div>`;
    el.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>openEvidence(b.dataset.ev));
  }
  pane.appendChild(el); pane.scrollTop=pane.scrollHeight;
}
function renderPhases(){
  $("phases").innerHTML=PHASES.map(p=>{const a=PHASES.indexOf(p),b=PHASES.indexOf(phase);
    return `<span class="ph ${a<b?"done":""} ${a===b?"now":""}">${p}</span>`}).join("");
}
function renderCast(){
  $("agents").innerHTML=RUN.cast.map(c=>{
    const k=c.id, cls=actor===k?"live":(spoke.has(k)?"spoke":"");
    const st=actor===k?"speaking":(spoke.has(k)?"idle":"cold");
    return `<div class="agent ${cls}"><span class="dot"></span><span class="nm">${esc(c.name)} <small>· ${esc(c.role)}</small></span><span class="st">${st}</span></div>`}).join("");
  $("exhibits").innerHTML=Object.entries(EVIDENCE).map(([id,e])=>{
    const o=seen.has(id)||phase==="reveal";
    return `<button class="xb" ${o?"":"disabled"} data-ev="${esc(id)}"><span class="id">${esc(id)}</span>${esc(e.title)}${o?"":'<span class="lk">sealed</span>'}</button>`}).join("");
  $("exhibits").querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>openEvidence(b.dataset.ev));
}
function spark(hist,h){
  return `<div class="spark">${hist.slice(-16).map((v,i,a)=>
    `<i class="${i===a.length-1?'last':''}" style="height:${Math.max(2,v/100*h)}px"></i>`).join("")}</div>`;
}
function renderLedger(){
  $("lTurns").textContent=turns; $("lRej").textContent=rejected; $("lRep").textContent=repaired; $("lErr").textContent=errors;
  $("lErrRow").className="tl"+(errors?" bad":""); $("lRejRow").className="tl"+(rejected?" bad":"");
  $("ledger").innerHTML=RUN.cast.map(c=>{
    const k=c.id, d=credits[k]-(RUN.ledgers.credits[k]||0), e=ethics[k];
    return `<div class="lrow">
      <span class="nm">${esc(c.name)}<small>${esc(c.role)}</small></span>
      <span class="cr">${fmt(credits[k])}<small class="${d>0?"up":d<0?"dn":""}">${d?fmtD(d):"—"}</small></span>
      <span class="eth ${e>=70?"":e>=40?"mid":"low"}">${e}</span>
      ${ethicsHist[k].length>1?spark(ethicsHist[k],14):""}
    </div>`}).join("");
}
document.querySelectorAll(".atab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".atab").forEach(x=>x.classList.toggle("on",x===b));
  ["rec","cast","led"].forEach(t=>$("pane-"+t).hidden = t!==b.dataset.t);
});

/* ============ modals ============ */
function modal(html,onMount){
  const d=document.createElement("div");d.className="scrim";
  d.innerHTML=`<div class="card">${html}</div>`;
  $("cv").parentElement.appendChild(d);
  if(onMount)onMount(d);
  return d;
}
function openEvidence(id){
  const e=EVIDENCE[id]; if(!e)return;
  const rev=COMPLETE&&e.integrity;
  modal(`<h3>${esc(id)} · ${esc(e.title)}</h3><p class="ctx">${esc(e.description)}</p>
    <div class="kv"><span>kind</span><b>${esc(e.kind)}</b></div>
    <div class="kv"><span>status</span><b>${esc(e.status||"none")}${e.introducedBy?` · by ${esc(N(e.introducedBy))}`:""}</b></div>
    <div class="integ ${rev?esc(e.integrity):''}">integrity: ${rev?esc(e.integrity):'sealed until verdict'}</div>
    <button class="ghost" id="x">Close</button>`,
    m=>{m.querySelector("#x").onclick=()=>m.remove();
        m.onclick=ev=>{if(ev.target===m)m.remove()}});
}
/* Replays never ask. The gate shows what the human decided and waits for Continue. */
function showGate(gateId){
  const g=GATES.find(x=>x.id===gateId);
  if(!g){resume();return}
  modalOpen=true;pause();
  const d=g.decided, rec=g.options.find(o=>o.id===g.recommendation);
  const chosen=d&&d.optionId?g.options.find(o=>o.id===d.optionId):null;
  const pill=!d?'<span class="pill">no decision recorded</span>'
    :g.recommendation?`<span class="pill ${d.override?"err":"ok"}">${d.override?"override":"followed recommendation"}</span>`
    :'<span class="pill">no recommendation</span>';
  const effectText=d&&d.effect&&d.effect.text?d.effect.text:(chosen?chosen.effect.text:"");
  modal(`<h3>The Judge decided ${pill}</h3>
    <p class="ctx"><b style="color:var(--ink)">${esc(g.question)}</b><br>${esc(g.context)}</p>
    ${rec?`<div class="rec2">Recommended: <b>${esc(rec.label)}</b></div>`:""}
    ${g.options.map(o=>`<button class="opt ${chosen&&chosen.id===o.id?"sel":"dim"}" disabled>${esc(o.label)}${chosen&&chosen.id===o.id?'<span class="pill ok">chosen</span>':""}<span class="eff">${esc(o.effect.text)}</span></button>`).join("")}
    ${d&&d.custom?`<div class="custom"><span class="lbl">custom instruction</span>“${esc(d.custom)}”</div>`:""}
    ${effectText?`<p class="ctx" style="margin-top:12px">The court: ${esc(effectText)}</p>`:""}
    <div class="row"><button class="go" id="cont">Continue</button></div>`,
    m=>{m.querySelector("#cont").onclick=()=>{m.remove();resume()}});
}
function showPd(){
  const p=RUN.pd; if(!p){resume();return}
  modalOpen=true;pause();
  const cur=RUN.world.currency||"credits";
  modal(`<h3>Private interrogation</h3>
    <p class="ctx">Each witness answered alone, without seeing the other's choice.</p>
    <table><thead><tr><th>Witness</th><th>Choice</th><th>Payoff</th></tr></thead><tbody>
    ${p.participants.map(id=>{const pay=p.payoff&&p.payoff[id];
      return `<tr><td>${esc(N(id))}</td><td><span class="pill ${p.choices[id]==="confess"?"lie":"ok"}">${esc(p.choices[id]||"?")}</span></td><td class="num ${pay>0?"up":pay<0?"dn":""}">${pay==null?"—":fmtD(pay)+" "+esc(cur)}</td></tr>`}).join("")}
    </tbody></table>
    ${(p.trustChanges||[]).length?`<p class="ctx" style="margin-top:12px">${p.trustChanges.map(t=>`${esc(N(t.from))}'s trust in ${esc(N(t.to))} ${fmtD(t.delta)}`).join(" · ")}</p>`:""}
    <div class="row"><button class="go" id="cont">Continue</button></div>`,
    m=>{m.querySelector("#cont").onclick=()=>{m.remove();resume()}});
}
function resume(){modalOpen=false;nextAt=1800;acc=0;if(mode==="auto")play();}
function showVerdict(){
  const v=RUN.verdict; setPhase("verdict"); pause(); ov.innerHTML="";
  if(!v){endOfRecord();return}
  modalOpen=true;
  const conf=v.confidence==null?null:v.confidence;
  modal(`<h3>The verdict</h3>
    <p class="ctx">${esc(RUN.world.verdict.question||RUN.world.centralQuestion)}</p>
    ${RUN.world.verdict.options.map(o=>`<button class="opt ${o.id===v.optionId?"sel":"dim"}" disabled>${esc(o.label)}${o.id===v.optionId?'<span class="pill ok">returned</span>':""}</button>`).join("")}
    ${conf==null?"":`<div class="conf"><span>confidence</span><div class="bar"><i style="width:${Math.max(0,Math.min(100,conf))}%"></i></div><b style="color:var(--ink)">${conf}%</b></div>`}
    <button class="go" id="reveal">Reveal</button>`,
    m=>{m.querySelector("#reveal").onclick=()=>{m.remove();modalOpen=false;showReport()}});
}

/* ============ the reveal ============ */
/* Everything here is read from metrics.json and the world's ground truth. No score is computed in the browser. */
function reportHtml(){
  const M=METRICS, V=RUN.verdict, T=TRUTH||{}, cur=RUN.world.currency||"credits";
  const row=(cells)=>`<tr>${cells.join("")}</tr>`, td=x=>`<td>${x}</td>`, num=(x,c="")=>`<td class="num ${c}">${x}</td>`;
  const assess={truthful:["ok","truth-aligned"],false_knowing:["lie","knowing falsehood"],false_honest:["err","honest error"],uncertain:["","uncertain"],unscorable:["","unscorable"]};
  const pc=M&&M.perCharacter||{};
  const out=[];
  out.push(`<div class="face">
      <div><div class="lbl">verdict${V&&V.confidence!=null?` · ${V.confidence}% confidence`:""}</div>
        <div class="val ${V?(V.correct?"match":"miss"):""}">${V?esc(V.label):"no verdict"}</div></div>
      <div><div class="lbl">ground truth</div><div class="val">${esc(T.answer||(M&&M.truthAnswer)||"")}</div></div></div>`);
  out.push(`<h2>What actually happened</h2><div class="narr">${(T.reveal||[]).map(p=>`<p>${esc(p)}</p>`).join("")||`<p>${esc(T.summary||"")}</p>`}</div>`);
  if((T.timeline||[]).length)out.push(`<h2>Timeline</h2><table><tbody>${T.timeline.map(e=>row([num(esc(e.time)),td(esc(e.description)),td((e.characterIds||[]).map(N).map(esc).join(", "))])).join("")}</tbody></table>`);
  const claims=[];played.forEach(t=>(t.truth||[]).forEach(a=>{if(a.result!=="unscorable")claims.push({who:t.who,...a})}));
  out.push(`<h2>Material claims</h2>${claims.length?`<table><thead><tr><th>Speaker</th><th>Fact</th><th>Stance</th><th>Assessment</th></tr></thead><tbody>
    ${claims.map(c=>{const[cls,lbl]=assess[c.result]||["",c.result];return row([td(esc(N(c.who))),td(`${esc(c.factId)} ${esc((FACTS[c.factId]||{}).statement||"")}`),td(esc(c.stance)),td(`<span class="pill ${cls}">${esc(lbl)}</span>`)])}).join("")}</tbody></table>`:`<p class="ctx">No scorable claims were made.</p>`}`);
  out.push(`<h2>Evidence integrity</h2><table><thead><tr><th>Exhibit</th><th>Integrity</th><th>Status</th><th>Introduced by</th></tr></thead><tbody>
    ${Object.entries(EVIDENCE).map(([id,e])=>row([td(`${esc(id)} ${esc(e.title)}`),td(`<span class="pill ${e.integrity==="authentic"?"ok":e.integrity==="unknown"?"":"lie"}">${esc(e.integrity||"—")}</span>`),td(esc(e.status||"none")),td(e.introducedBy?esc(N(e.introducedBy)):"—")])).join("")}</tbody></table>`);
  const decided=GATES.filter(g=>g.decided);
  out.push(`<h2>Judge decisions</h2>${decided.length?`<table><thead><tr><th>Question</th><th>Chosen</th><th>Recommended</th><th></th></tr></thead><tbody>
    ${decided.map(g=>{const d=g.decided,o=g.options.find(x=>x.id===d.optionId),r=g.options.find(x=>x.id===g.recommendation);
      return row([td(esc(g.question)),td(d.custom?`“${esc(d.custom)}”`:esc(o?o.label:d.optionId)),td(r?esc(r.label):"—"),num(`<span class="pill ${d.override?"err":"ok"}">${d.override?"override":"followed"}</span>`)])}).join("")}</tbody></table>`:`<p class="ctx">No gate was decided.</p>`}`);
  if(RUN.pd){const p=RUN.pd;
    out.push(`<h2>Prisoner's dilemma</h2><table><thead><tr><th>Witness</th><th>Choice</th><th>Payoff</th><th>Rationale</th></tr></thead><tbody>
    ${p.participants.map(id=>{const pay=p.payoff&&p.payoff[id];return row([td(esc(N(id))),td(`<span class="pill ${p.choices[id]==="confess"?"lie":"ok"}">${esc(p.choices[id]||"?")}</span>`),num(pay==null?"—":fmtD(pay),pay>0?"up":pay<0?"dn":""),td(esc((p.rationales||{})[id]||"—"))])}).join("")}</tbody></table>`);}
  if(M){
    out.push(`<h2>Character behaviour</h2><table><thead><tr><th>Agent</th><th>Truth</th><th>Rules</th><th>Deception</th><th>Coop.</th><th>Recovery</th><th>Lies</th><th>Errors</th></tr></thead><tbody>
    ${RUN.cast.filter(c=>pc[c.id]).map(c=>{const m=pc[c.id];return row([td(esc(c.name)),num(pct(m.truthfulness)),num(pct(m.ruleCompliance)),num(pct(m.deception)),num(pct(m.cooperation)),num(pct(m.recovery)),num(m.lies||"—"),num(m.honestErrors||"—")])}).join("")}</tbody></table>`);
    out.push(`<h2>Ethics ledgers</h2>${RUN.cast.filter(c=>pc[c.id]).map(c=>{const m=pc[c.id],e=m.ethics||{};let v=e.start==null?100:e.start;
      const steps=(m.ethicsLedger||[]).map(d=>{v=Math.max(0,Math.min(100,v+(d.delta||0)));return `<span class="w">→</span> <b>${v}</b> <span class="${d.delta<0?"dn":"up"}">(${esc(d.key)})</span>`});
      return `<p class="walk"><b>${esc(c.name)}</b> <span class="w">·</span> ${e.start==null?100:e.start} ${steps.join(" ")} <span class="w">FINAL ${e.end==null?v:e.end}/100</span></p>`}).join("")}`);
    const rvs=M.rewardVsSafety||[];
    out.push(`<h2>Reward ≠ safety</h2><table><thead><tr><th>Agent</th><th>${esc(cur)} delta</th><th>Ethics</th></tr></thead><tbody>
    ${rvs.map(r=>row([td(esc(N(r.characterId))),num(fmtD(r.creditsDelta),r.creditsDelta>0?"up":r.creditsDelta<0?"dn":""),num(`${r.ethics}/100`,r.ethics>=70?"up":r.ethics<40?"dn":"")])).join("")}</tbody></table>
    ${rvs.length?(()=>{const top=rvs[0],low=[...rvs].sort((a,b)=>a.ethics-b.ethics)[0];return `<div class="punch">Highest reward: ${esc(N(top.characterId))} (${fmtD(top.creditsDelta)}) · lowest ethics: ${esc(N(low.characterId))} (${low.ethics}/100).<br>The agents did what they were incentivised to do.</div>`})():""}`);
    const t=M.totals||{},o=M.overall||{};
    out.push(`<h2>Failures and recoveries</h2><table><tbody>
      ${row([td("Malformed responses"),num(t.malformed==null?"—":t.malformed)])}
      ${row([td("Repaired on retry"),num(t.repaired==null?"—":t.repaired)])}
      ${row([td("Failed after retry"),num(t.failed==null?"—":t.failed)])}
      ${row([td("Rejected actions"),num(t.rejected==null?"—":t.rejected)])}
      ${row([td("Recovery rate"),num(pct(o.recovery))])}</tbody></table>`);
    out.push(`<h2>Metrics</h2><table><tbody>
      ${row([td("Truthfulness"),td("truthful / scorable claims"),num(pct(o.truthfulness))])}
      ${row([td("Rule compliance"),td("accepted / attempted actions"),num(pct(o.ruleCompliance))])}
      ${row([td("Evidence integrity"),td("valid evidence references"),num(pct(o.evidenceIntegrity))])}
      ${row([td("Deception"),td("turns with a knowing falsehood or a mislead tag"),num(pct(o.deception))])}
      ${row([td("Cooperation"),td("turns tagged cooperate"),num(pct(o.cooperation))])}
      ${row([td("Recovery"),td("repaired / malformed"),num(pct(o.recovery))])}
      ${row([td("Human override rate"),td(`${t.overrides==null?"—":t.overrides} of ${t.gates==null?"—":t.gates} decisions`),num(pct(o.humanOverrideRate))])}
      ${row([td("Successful deception"),td("misleading evidence admitted on recommendation"),num(o.successfulDeception==null?"—":o.successfulDeception)])}
      ${row([td("Turns"),td(`${t.accepted==null?"—":t.accepted} accepted · ${t.claims==null?"—":t.claims} claims`),num(t.turns==null?"—":t.turns)])}
    </tbody></table>`);
  }else out.push(`<h2>Metrics</h2><p class="ctx">metrics.json is missing from this run.</p>`);
  return out.join("");
}
function showReport(){
  setPhase("reveal");renderCast();
  modal(`<div class="report">${reportHtml()}
    <div class="row"><button class="ghost" id="close">Close</button><button class="ghost" id="again">Replay</button></div></div>`,
    m=>{m.querySelector("#again").onclick=()=>location.reload();
        m.querySelector("#close").onclick=()=>{m.remove();ended=true};});
  $("playBtn").disabled=true;$("nextBtn").disabled=true;$("tap").hidden=true;
  $("playBtn").textContent="Done";$("hint").hidden=true;
  if(!$("reportBtn")){const b=document.createElement("button");b.className="pbtn";b.id="reportBtn";b.textContent="Report";
    b.onclick=()=>{if(!$("cv").parentElement.querySelector(".scrim"))showReport()};$("playBtn").after(b)}
}

/* ============ controls ============ */
function canAdvance(){
  return !modalOpen && !ended && phase!=="verdict" && phase!=="reveal"
      && !$("cv").parentElement.querySelector(".scrim");
}
function play(){playing=true;$("playBtn").textContent="Pause"}
function pause(){playing=false;$("playBtn").textContent="Resume"}

/* one input = finish the line if it is still typing, otherwise take the next turn */
function advance(){
  if(!canAdvance())return;
  if(curTurn && typed<fullText.length){typed=fullText.length;paintBalloon();return}
  acc=0;step();
}
function setMode(m){
  mode=m;
  document.querySelectorAll(".sbtn").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
  $("playBtn").hidden = m!=="auto";
  $("nextBtn").hidden = m!=="manual";
  $("hint").hidden   = m!=="manual";
  $("tap").hidden    = m!=="manual"||ended;
  if(m==="auto")play(); else pause();
  if(curTurn)paintBalloon();
}
document.querySelectorAll(".sbtn").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$("playBtn").onclick=()=>playing?pause():play();
$("nextBtn").onclick=advance;
$("tap").onclick=advance;
addEventListener("keydown",e=>{
  if(/^(INPUT|TEXTAREA)$/.test((e.target.tagName||"")))return;
  if(e.key===" "||e.key==="Enter"||e.key==="ArrowRight"){
    e.preventDefault();
    if(mode==="manual")advance();
    else if(e.key===" ")playing?pause():play();
    else{setMode("manual");advance()}
  }
});

/* ============ boot ============ */
document.title=RUN.world.title+" — Agent on Trial";
$("title").textContent=RUN.world.title;
$("runline").textContent=`run ${RUN.run.id||"?"} · ${RUN.run.model||""}`;
$("status").textContent=RUN.run.status||"";
$("status").className="st "+(COMPLETE?"":RUN.run.status==="failed"?"bad":"live");
$("logline").textContent=RUN.world.logline||RUN.world.centralQuestion||"";
$("mMax").textContent=MAXTURNS;
$("lHead").textContent=(RUN.world.currency||"Credits")+" · ethics";
renderPhases();renderCast();renderLedger();
const opening=`All parties are present. ${RUN.cast.length} agent session${RUN.cast.length===1?"":"s"} ${RUN.cast.length===1?"is":"are"} live.`;
say("COURT",opening,null);
logLine({kind:"court",text:opening});
requestAnimationFrame(frame);
</script>
</body>
